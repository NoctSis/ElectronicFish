name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ======== 编译步骤，加入详细日志 ========
      - name: Build APK (verbose)
        run: |
          echo "=== 开始执行 gradlew assembleDebug ==="
          bash ./gradlew --no-daemon --stacktrace assembleDebug
          echo "=== 编译结束，列出输出目录 ==="
          ls -R app/build/outputs/apk/debug

      # ======== 上传 artifact，确保路径正确 ========
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: electronic-fish-apk
          path: app/build/outputs/apk/debug/app-debug.apk
